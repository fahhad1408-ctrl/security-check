<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحقق الأمني الشامل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            text-align: center;
            padding: 20px;
            margin: 0;
            /* حظر تام لتحديد النصوص أو نسخها بالكامل */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .container {
            max-width: 420px;
            margin: 30px auto;
            background: #111827;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #result-box {
            margin-top: 20px;
            text-align: right;
            background: #030712;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-size: 12px;
            border: 1px solid #1f2937;
            line-height: 1.8;
        }
        .pass { color: #4ade80; font-weight: bold; font-size: 14px; }
        .fail { color: #f87171; font-weight: bold; font-size: 14px; }
        .warning { color: #facc15; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡 فحص الأمان السيبراني</h2>
        <p>نظام ذكي لتحليل بيئة الجهاز، نوع الاتصال، حالة البطارية، وكشف التلاعب الجغرافي بدقة تامة.</p>
        
        <button class="btn" id="start-btn" onclick="runUltimateSecurityScan()">بدء الفحص الشامل 🔍</button>
        
        <div id="result-box">
            <div id="scan-content">جاري التحقق من الحماية والبيئة...</div>
        </div>
    </div>

    <script>
        // 🔒 حماية حديدية: منع النقر بالزر الأيمن للفأرة منعاً باتاً
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // 🔒 حماية حديدية: منع كافة اختصارات لوحة المفاتيح (عرض المصدر، أدوات المطورين، الحفظ، الطباعة)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && ['u', 'U', 's', 'S', 'i', 'I', 'j', 'J', 'c', 'C', 'p', 'P', 'h', 'H'].includes(e.key)) ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c', 'K', 'k'].includes(e.key))) {
                e.preventDefault();
                return false;
            }
        });

        // 🔒 حماية تليجرام: التحقق أن الجلسة قادمة حصرياً من البوت الرسمي
        window.addEventListener('DOMContentLoaded', () => {
            const telegram = window.Telegram && window.Telegram.WebApp;
            if (!telegram || !telegram.initData || telegram.initData === "") {
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top:100px; color:#f87171; font-family:Tahoma; padding: 20px;">
                        <h2>❌ خطأ في الأمان والوصول</h2>
                        <p>عذراً، لا يمكن فتح هذه الصفحة نهائياً إلا من خلال بوت تليجرام الرسمي المخصص فقط.</p>
                    </div>`;
            } else {
                telegram.ready();
                telegram.expand();
            }
        });

        // دالة الفحص الأمني والتحليل الشامل
        async function runUltimateSecurityScan() {
            const btn = document.getElementById("start-btn");
            const box = document.getElementById("result-box");
            const content = document.getElementById("scan-content");

            btn.disabled = true;
            btn.innerText = "جاري إجراء التحليل الدقيق...";
            box.style.display = "block";
            content.innerHTML = "⏳ جاري فحص المستشعرات، طاقة الجهاز، ونوع الشبكة...<br>";

            // 1. تحليل نوع الجهاز ونظام التشغيل
            const ua = navigator.userAgent;
            let deviceName = "جهاز غير معروف";
            if (/android/i.test(ua)) {
                deviceName = "نظام Android";
                const match = ua.match(/;\s?([^;]+)\s?Build\//);
                if (match && match[1]) deviceName += ` (${match[1].trim()})`;
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                deviceName = "Apple iOS (iPhone / iPad)";
            } else if (/win/i.test(ua)) {
                deviceName = "كمبيوتر Windows";
            } else if (/mac/i.test(ua)) {
                deviceName = "جهاز Mac";
            }

            // 2. تحليل البطارية
            let batteryInfo = "غير متاح";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    batteryInfo = `${level}% (${battery.charging ? 'يتم الشحن ⚡' : 'لا يتم الشحن 🔋'})`;
                }
            } catch (e) {
                batteryInfo = "غير مدعوم على المتصفح";
            }

            // 3. تحليل نوع الاتصال (واي فاي / شريحة جيل 4G/5G)
            let effectiveType = "غير معروف";
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection && connection.effectiveType) {
                effectiveType = connection.effectiveType.toUpperCase();
            }
            let connectionCategory = (ua.includes('Mobile') == false) ? "شبكة لاسلكية ثابتة (Wi-Fi)" : `بيانات الجوال (شريحة اتصال - جيل ${effectiveType})`;

            // 4. كشف وضع المطور وتصحيح الأخطاء
            let devModeDetected = false;
            const startCheck = performance.now();
            debugger;
            const endCheck = performance.now();
            if ((endCheck - startCheck) > 100) {
                devModeDetected = true;
            }

            // 5. فحص الموقع الجغرافي وكشف التلاعب (Mock GPS)
            if (!navigator.geolocation) {
                content.innerHTML = "<span class='fail'>❌ المتصفح لا يدعم تحديد الموقع.</span>";
                btn.disabled = false;
                btn.innerText = "إعادة الفحص";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // كشف التلاعب الإحداثي (Mock GPS) عبر دقة المستشعر المريبة
                    let fakeGps = (accuracy === 0 || accuracy === 1 || accuracy < 3);

                    // خوارزمية تحديد النتيجة النهائية (سليم / مشبوه / مكشوف)
                    let statusResult = "<span class='pass'>سليم (آمن ومطابق 100%) ✅</span>";
                    if (fakeGps) {
                        statusResult = "<span class='fail'>مكشوف (تم رصد تلاعب بالموقع / Fake GPS) 🚨</span>";
                    } else if (devModeDetected) {
                        statusResult = "<span class='warning'>مشبوه (وضع المطور أو التصحيح مفعل) ⚠️</span>";
                    }

                    // تجميع التقرير النهائي الشامل
                    let html = `<b>📊 تقرير التحليل الأمني النهائي:</b><br><br>`;
                    html += `• <b>الحالة العامة:</b> ${statusResult}<br>`;
                    html += `<hr style="border-color:#1f2937; margin:10px 0;">`;
                    html += `• نوع الجهاز: <b>${deviceName}</b><br>`;
                    html += `• نسبة البطارية: <b>${batteryInfo}</b><br>`;
                    html += `• نوع الاتصال: <b>${connectionCategory}</b><br>`;
                    html += `• وضع المطور: ${devModeDetected ? "<span class='fail'>مفعل ⚠️</span>" : "<span class='pass'>غير مفعل ✅</span>"}<br>`;
                    html += `• فحص التلاعب بالموقع: ${fakeGps ? "<span class='fail'>يوجد تلاعب خطير 🚨</span>" : "<span class='pass'>سليم وبدون تلاعب ✅</span>"}<br>`;
                    html += `<hr style="border-color:#1f2937; margin:10px 0;">`;
                    html += `<b>الموقع الجغرافي الحقيقي:</b><br>خط العرض: ${lat.toFixed(5)}<br>خط الطول: ${lon.toFixed(5)}`;

                    content.innerHTML = html;
                    btn.style.display = "none";
                },
                (error) => {
                    content.innerHTML = "<span class='fail'>❌ فشل الفحص: يجب منح إذن الوصول للموقع لإتمام التحليل الأمني بنجاح.</span>";
                    btn.disabled = false;
                    btn.innerText = "إعادة الفحص";
                },
                { timeout: 12000, enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
