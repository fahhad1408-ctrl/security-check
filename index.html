<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص الأمان المتقدم وكشف التلاعب</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 420px;
            margin: 30px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #result-box {
            margin-top: 25px;
            text-align: right;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-size: 13px;
            border: 1px solid #334155;
        }
        .status-pass { color: #4ade80; font-weight: bold; }
        .status-fail { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡 فحص الأمان الشامل</h2>
        <p>انقر أدناه لبدء فحص بيئة النظام، كشف الـ VPN، رصد التلاعب بالموقع الإحداثي، والتحقق من الأمان.</p>
        
        <button class="btn" id="start-btn" onclick="runFullSecurityScan()">بدء الفحص الشامل 🔍</button>
        
        <div id="result-box">
            <div id="scan-content">جاري فحص الجهاز والشبكة...</div>
        </div>
    </div>

    <script>
        // 🔒 حماية المصدر (منع الماوس الأيمن والاختصارات)
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && ['u','U','s','S','i','I','j','J','c','C'].includes(e.key))) {
                e.preventDefault();
                return false;
            }
        });

        // حماية تليجرام
        window.addEventListener('DOMContentLoaded', () => {
            const telegram = window.Telegram && window.Telegram.WebApp;
            if (!telegram || !telegram.initData || telegram.initData === "") {
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top:100px; color:#f87171; font-family:Tahoma;">
                        <h2>❌ غير مسموح بالدخول</h2>
                        <p>يجب فتح الرابط حصرياً من داخل بوت تليجرام الرسمي.</p>
                    </div>`;
            } else {
                telegram.ready();
                telegram.expand();
            }
        });

        // دالة الفحص الأمني الشامل
        async function runFullSecurityScan() {
            const btn = document.getElementById("start-btn");
            const box = document.getElementById("result-box");
            const content = document.getElementById("scan-content");
            
            btn.disabled = true;
            btn.innerText = "جاري الفحص الدقيق...";
            box.style.display = "block";
            content.innerHTML = "📡 جاري فحص الشبكة والاتصال (VPN)...<br>";

            let vpnDetected = false;
            let ipInfo = "غير معروف";

            // 1. فحص الـ VPN عبر خدمة فحص الـ IP والشبكة
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                ipInfo = data.ip || "مخفي";
                
                // مؤشرات أولية للـ VPN أو الاستضافات المشبوهة
                const org = (data.org || "").toLowerCase();
                const network = (data.network || "").toLowerCase();
                if (org.includes('vpn') || org.includes('proxy') || org.includes('hosting') || org.includes('cloudflare') || org.includes('digitalocean')) {
                    vpnDetected = true;
                }
            } catch (e) {
                ipInfo = "تعذر الفحص";
            }

            content.innerHTML += "📍 جاري رصد إحداثيات الموقع وكشف التلاعب (Mock GPS)...<br>";

            // 2. فحص الموقع الجغرافي وكشف التلاعب الإحداثي
            if (!navigator.geolocation) {
                content.innerHTML += "<span class='status-fail'>❌ المتصفح لا يدعم تحديد الموقع.</span>";
                btn.disabled = false;
                btn.innerText = "إعادة الفحص";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy; // دقة الإحداثيات بالمتر

                    let fakeGpsDetected = false;

                    // المؤشر الذكي لكشف التلاعب: 
                    // برامج الFake GPS غالباً تعطيك دقة مثالية بشكل مريب (مثل accuracy = 0 أو رقم ثابت بدقة متناهية جداً لا تصدر عن مستشعر حقيقي)
                    // أو إحداثيات بأرقام أصفار متكررة، أو دقة ضعيفة جداً فوق الكيلومتر في بيئة مفتوحة.
                    if (accuracy === 0 || accuracy === 1 || (accuracy < 3 && !position.coords.altitude)) {
                        fakeGpsDetected = true;
                    }

                    // تجهيز التقرير النهائي
                    let reportHTML = `<b>📊 تقرير الفحص الأمني:</b><br>`;
                    reportHTML += `• عنوان الـ IP: <code>${ipInfo}</code><br>`;
                    
                    if (vpnDetected) {
                        reportHTML += `• فحص الاتصال: <span class='status-fail'>⚠️ محتمل استخدام VPN / بروكسي</span><br>`;
                    } else {
                        reportHTML += `• فحص الاتصال: <span class='status-pass'>✅ اتصال محلي طبيعي (سليم)</span><br>`;
                    }

                    reportHTML += `• دقة المستشعر: ${accuracy} متر<br>`;

                    if (fakeGpsDetected) {
                        reportHTML += `• فحص الموقع: <span class='status-fail'>🚨 تم رصد تلاعب بالموقع (Mock / Fake GPS)</span><br>`;
                    } else {
                        reportHTML += `• فحص الموقع: <span class='status-pass'>✅ الموقع سليم وحقيقي (غير مكشوف للتلاعب)</span><br>`;
                    }

                    reportHTML += `<hr style="border-color:#334155; margin:10px 0;">`;
                    reportHTML += `الإحداثيات المرصودة:<br>خط العرض: ${lat.toFixed(5)}<br>خط الطول: ${lon.toFixed(5)}`;

                    content.innerHTML = reportHTML;
                    btn.style.display = "none";
                },
                (error) => {
                    content.innerHTML = "<span class='status-fail'>❌ فشل الفحص: يجب السماح للمتصفح بالوصول للموقع لإتمام التحقق الأمني.</span>";
                    btn.disabled = false;
                    btn.innerText = "إعادة الفحص";
                },
                { timeout: 12000, enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
