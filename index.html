<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الفحص السيبراني المتقدمة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #030712;
            color: #00ffcc;
            text-align: center;
            padding: 15px;
            margin: 0;
            /* حظر تام لتحديد النصوص أو النسخ أو التفاعل غير المرغوب */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .container {
            max-width: 440px;
            margin: 15px auto;
            background: #0b0f19;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.12);
            border: 1px solid #1e293b;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 21px;
        }
        p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 18px rgba(37,99,235,0.4);
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #scan-steps {
            margin-top: 15px;
            text-align: right;
            background: #020408;
            padding: 14px;
            border-radius: 10px;
            display: none;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #1e293b;
            height: 180px;
            overflow-y: auto;
            color: #38bdf8;
            line-height: 1.7;
        }
        #final-report {
            margin-top: 15px;
            text-align: right;
            background: #0b1329;
            padding: 16px;
            border-radius: 12px;
            display: none;
            font-size: 12px;
            border: 1px solid #334155;
            line-height: 1.9;
        }
        .pass { color: #4ade80; font-weight: bold; font-size: 14px; }
        .fail { color: #f87171; font-weight: bold; font-size: 14px; }
        .warning { color: #facc15; font-weight: bold; font-size: 14px; }
        .step-item { margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>🛡 وحدة التحليل السيبراني الذكي</h2>
        <p>نظام فحص حقيقي شامل لكشف التلاعب الجغرافي، حالة النظام، البطارية، والاتصال بدقة متناهية.</p>
        
        <button class="btn" id="start-btn" onclick="runRealCyberScan()">بدء فحص الجهاز الآن 🔍</button>
        
        <div id="scan-steps"></div>
        <div id="final-report"></div>
    </div>

    <script>
        // 🔒 حماية أمنية حديدية: منع النقر بالزر الأيمن للفأرة منعاً باتاً
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            return false;
        });

        // 🔒 حماية أمنية حديدية: منع كافة اختصارات لوحة المفاتيح (عرض المصدر، أدوات المطورين، الحفظ، الطباعة)
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || 
                (e.ctrlKey && ['u', 'U', 's', 'S', 'i', 'I', 'j', 'J', 'c', 'C', 'p', 'P', 'h', 'H'].includes(e.key)) ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c', 'K', 'k'].includes(e.key))) {
                e.preventDefault();
                return false;
            }
        });

        // 🔒 حماية تليجرام الصارمة: التحقق أن الجلسة قادمة حصرياً من البوت الرسمي
        window.addEventListener('DOMContentLoaded', () => {
            const telegram = window.Telegram && window.Telegram.WebApp;
            if (!telegram || !telegram.initData || telegram.initData === "") {
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top:120px; color:#f87171; font-family:Tahoma; padding: 20px;">
                        <h2>❌ وصول غير مرخص</h2>
                        <p>عذراً، لا يمكن فتح هذه الصفحة مطلقاً إلا من خلال بوت تليجرام الرسمي المخصص فقط.</p>
                    </div>`;
            } else {
                telegram.ready();
                telegram.expand();
            }
        });

        async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // دالة الفحص الحقيقي المتكامل مع الشاشة التفاعلية الواقعية
        async function runRealCyberScan() {
            const btn = document.getElementById("start-btn");
            const stepsBox = document.getElementById("scan-steps");
            const finalBox = document.getElementById("final-report");

            btn.disabled = true;
            btn.innerText = "جاري الفحص المعمق...";
            stepsBox.style.display = "block";
            finalBox.style.display = "none";
            stepsBox.innerHTML = "";

            const log = (text, color = "#38bdf8") => {
                stepsBox.innerHTML += `<div class="step-item" style="color: ${color};">${text}</div>`;
                stepsBox.scrollTop = stepsBox.scrollHeight;
            };

            // 1. مراحل الشخل والتحليل التفاعلي الوهمي المرعب
            log("[~] تهيئة اتصال آمن مع النواة والبيئة التشغيلية...");
            await sleep(500);
            
            log("[*] فحص ملفات النظام والبحث عن أدوات الروت أو الجيلبريك...");
            let rootOrJailbreak = false;
            const ua = navigator.userAgent;
            if (/android/i.test(ua) && (window.location.protocol === 'file:' || ua.includes('Custom'))) {
                rootOrJailbreak = true;
            }
            await sleep(700);

            log("[*] استعلام عن حالة استهلاك طاقة المعالج والبطارية...", "#fbbf24");
            let batteryInfo = "غير متاح";
            let batteryCharging = false;
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}%`;
                    batteryCharging = battery.charging;
                }
            } catch(e) {}
            await sleep(600);

            log("[*] فحص شبكة الاتصال ونوع الجيل ومسار الـ IP...");
            let effectiveType = "4G";
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection && connection.effectiveType) {
                effectiveType = connection.effectiveType.toUpperCase();
            }
            await sleep(700);

            log("[*] كشف وضع المطور وتصحيح الأخطاء (Developer Options / Debuggers)...", "#fbbf24");
            let devMode = false;
            const t1 = performance.now();
            debugger;
            const t2 = performance.now();
            if ((t2 - t1) > 100) devMode = true;
            await sleep(600);

            log("[+] استشعار المستشعرات الجغرافية ورصد التلاعب الإحداثي...", "#4ade80");

            // 2. الفحص الحقيقي للموقع الجغرافي والتلاعب
            if (!navigator.geolocation) {
                stepsBox.innerHTML += "<br><span class='fail'>[-] المتصفح لا يدعم تحديد الموقع الجغرافي.</span>";
                btn.disabled = false;
                btn.innerText = "إعادة الفحص";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // كشف التلاعب الجغرافي بناءً على دقة مستشعر الموقع المريبة
                    let fakeGps = (accuracy === 0 || accuracy === 1 || accuracy < 3);

                    await sleep(500);
                    log("[✓] تم إتمام فحص  كافة أجزاء الجهاز بنجاح!", "#4ade80");
                    await sleep(400);

                    stepsBox.style.display = "none";

                    // تقييم الحالة النهائية (سليم / مشبوه / مكشوف)
                    let statusResult = "<span class='pass'>سليم (آمن تماماً وخالٍ من أي تلاعب) ✅</span>";
                    if (fakeGps || rootOrJailbreak) {
                        statusResult = "<span class='fail'>مكشوف (تم رصد تلاعب خطير / موقع وهمي أو جيلبريك) 🚨</span>";
                    } else if (devMode) {
                        statusResult = "<span class='warning'>مشبوه (وضع المطور أو أدوات التصحيح مفعلة) ⚠️</span>";
                    }

                    let deviceName = "جهاز ذكي (Mobile)";
                    if (/android/i.test(ua)) deviceName = "نظام Android";
                    else if (/iphone|ipad|ipod/i.test(ua)) deviceName = "Apple iOS (iPhone)";
                    else if (/win/i.test(ua)) deviceName = "كمبيوتر Windows";

                    let connectionCategory = ua.includes('Mobile') ? `بيانات الجوال (شريحة اتصال - جيل ${effectiveType})` : "شبكة لاسلكية ثابتة (Wi-Fi)";

                    // بناء التقرير النهائي الخيالي والجميل
                    let reportHtml = `<b>📊 تقرير التحليل السيبراني النهائي:</b><br><br>`;
                    reportHtml += `• <b>الحالة العامة:</b> ${statusResult}<br>`;
                    reportHtml += `<hr style="border-color:#334155; margin:10px 0;">`;
                    reportHtml += `• نوع النظام: <b>${deviceName}</b><br>`;
                    reportHtml += `• البطارية: <b>${batteryInfo} ${batteryCharging ? '(يشحن ⚡)' : '(لا يشحن 🔋)'}</b><br>`;
                    reportHtml += `• نوع الاتصال: <b>${connectionCategory}</b><br>`;
                    reportHtml += `• نظام الحماية (روت/جيلبريك): ${rootOrJailbreak ? "<span class='fail'>مكتشف 🚨</span>" : "<span class='pass'>سليم ✅</span>"}<br>`;
                    reportHtml += `• وضع المطور: ${devMode ? "<span class='warning'>مفعل ⚠️</span>" : "<span class='pass'>مغلق ✅</span>"}<br>`;
                    reportHtml += `• فحص التلاعب بالموقع: ${fakeGps ? "<span class='fail'>يوجد تلاعب (Mock GPS) 🚨</span>" : "<span class='pass'>سليم وبدون تلاعب ✅</span>"}<br>`;
                    reportHtml += `<hr style="border-color:#334155; margin:10px 0;">`;
                    reportHtml += `<b>الإحداثيات الحقيقية للموقع:</b><br>خط العرض: ${lat.toFixed(5)}<br>خط الطول: ${lon.toFixed(5)}`;

                    finalBox.innerHTML = reportHtml;
                    finalBox.style.display = "block";
                    btn.style.display = "none";
                },
                (error) => {
                    stepsBox.innerHTML += "<br><span class='fail'>[-] فشل رصد الموقع: يرجى السماح بالإذن لتتم عملية الفحص بنجاح.</span>";
                    btn.disabled = false;
                    btn.innerText = "إعادة الفحص";
                },
                { timeout: 12000, enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
