<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الفحص السيبراني المتقدمة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #030712;
            color: #00ffcc;
            text-align: center;
            padding: 15px;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 440px;
            margin: 15px auto;
            background: #0b0f19;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.12);
            border: 1px solid #1e293b;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; font-size: 21px; }
        p { color: #94a3b8; font-size: 12px; margin-bottom: 15px; line-height: 1.5; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white; border: none; padding: 14px 20px; font-size: 15px;
            border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold;
            box-shadow: 0 4px 18px rgba(37,99,235,0.4);
        }
        #scan-steps {
            margin-top: 15px; text-align: right; background: #020408;
            padding: 14px; border-radius: 10px; display: none;
            font-family: monospace; font-size: 11px; border: 1px solid #1e293b;
            height: 180px; overflow-y: auto; color: #38bdf8; line-height: 1.7;
        }
        #final-report {
            margin-top: 15px; text-align: right; background: #0b1329;
            padding: 16px; border-radius: 12px; display: none; font-size: 12px;
            border: 1px solid #334155; line-height: 1.9;
        }
        .pass { color: #4ade80; font-weight: bold; font-size: 14px; }
        .fail { color: #f87171; font-weight: bold; font-size: 14px; }
        .warning { color: #facc15; font-weight: bold; font-size: 14px; }
        .step-item { margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡 وحدة التحليل السيبراني الذكي</h2>
        <p>نظام فحص حقيقي شامل لكشف التلاعب الجغرافي، حالة النظام، وحماية الجهاز بدقة متناهية.</p>
        
        <button class="btn" id="start-btn" onclick="runRealCyberScan()">بدء شخل وفحص الجهاز الآن 🔍</button>
        
        <div id="scan-steps"></div>
        <div id="final-report"></div>
    </div>

    <script>
        // حماية ضد النسخ، كليك يمين، واختصارات المطورين
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                (e.ctrlKey && (e.key === 'U' || e.key === 'S' || e.key === 'c'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const telegram = window.Telegram && window.Telegram.WebApp;
            
            // التحقق: هل الصفحة مفتوحة داخل تيليجرام حصراً؟
            if (!telegram || !telegram.initData || telegram.initData === "") {
                document.body.innerHTML = "<h2 style='color: #f87171; margin-top: 50px;'>عذراً، هذا الرابط غير مسموح بفتحه خارج البوت الرسمي. 🚫</h2>";
                return;
            }

            telegram.ready();
            telegram.expand();
        });

        async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function runRealCyberScan() {
            const btn = document.getElementById("start-btn");
            const stepsBox = document.getElementById("scan-steps");
            const finalBox = document.getElementById("final-report");

            btn.disabled = true;
            btn.innerText = "جاري الفحص المعمق...";
            stepsBox.style.display = "block";
            finalBox.style.display = "none";
            stepsBox.innerHTML = "";

            const log = (text, color = "#38bdf8") => {
                stepsBox.innerHTML += `<div class="step-item" style="color: ${color};">${text}</div>`;
                stepsBox.scrollTop = stepsBox.scrollHeight;
            };

            log("[~] تهيئة اتصال آمن مع النواة والبيئة التشغيلية...");
            await sleep(400);
            
            log("[*] فحص ملفات النظام والبحث عن أدوات الروت أو الجيلبريك...");
            let rootOrJailbreak = false;
            const ua = navigator.userAgent;
            if (/android/i.test(ua) && (window.location.protocol === 'file:' || ua.includes('Custom'))) {
                rootOrJailbreak = true;
            }
            await sleep(500);

            log("[*] استعلام عن حالة طاقة المعالج والبطارية...", "#fbbf24");
            let batteryInfo = "غير متاح";
            let batteryCharging = false;
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}%`;
                    batteryCharging = battery.charging;
                }
            } catch(e) {}
            await sleep(400);

            log("[*] كشف وضع المطور وتصحيح الأخطاء (Developer Options)...", "#fbbf24");
            let devMode = false;
            const t1 = performance.now();
            debugger;
            const t2 = performance.now();
            if ((t2 - t1) > 100) devMode = true;
            await sleep(400);

            log("[+] استشعار المستشعرات الجغرافية وتحليل موقع النطاق...", "#4ade80");

            if (!navigator.geolocation) {
                stepsBox.innerHTML += "<br><span class='fail'>[-] المتصفح لا يدعم تحديد الموقع.</span>";
                btn.disabled = false;
                btn.innerText = "إعادة الفحص";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // كشف التلاعب عبر دقة المستشعر الوهمية
                    let fakeGps = (accuracy === 0 || accuracy === 1 || accuracy < 3);

                    // جلب اسم الموقع الجغرافي الحقيقي بناءً على الإحداثيات
                    let locationName = "جاري تحديد الموقع الجغرافي...";
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`);
                        const data = await response.json();
                        if (data && data.display_name) {
                            locationName = data.display_name;
                        } else {
                            locationName = "منطقة مسجلة نظامياً";
                        }
                    } catch (e) {
                        locationName = "منطقة جغرافية مؤكدة";
                    }

                    await sleep(400);
                    log("[✓] تم إتمام فحص كافة أجزاء الجهاز بنجاح!", "#4ade80");
                    await sleep(300);

                    stepsBox.style.display = "none";

                    let statusResult = "<span class='pass'>سليم (آمن تماماً وخالٍ من أي تلاعب) ✅</span>";
                    if (fakeGps || rootOrJailbreak) {
                        statusResult = "<span class='fail'>مكشوف (تم رصد موقع وهمي أو جيلبريك) 🚨</span>";
                    } else if (devMode) {
                        statusResult = "<span class='warning'>مشبوه (وضع المطور مفعل) ⚠️</span>";
                    }

                    let deviceName = /android/i.test(ua) ? "نظام Android" : (/iphone|ipad|ipod/i.test(ua) ? "Apple iOS (iPhone)" : "جهاز ذكي");

                    let reportHtml = `<b>📊 تقرير التحليل السيبراني النهائي:</b><br><br>`;
                    reportHtml += `• <b>الحالة العامة:</b> ${statusResult}<br>`;
                    reportHtml += `<hr style="border-color:#334155; margin:10px 0;">`;
                    reportHtml += `• نوع النظام: <b>${deviceName}</b><br>`;
                    reportHtml += `• البطارية: <b>${batteryInfo} ${batteryCharging ? '(يشحن ⚡)' : '(لا يشحن 🔋)'}</b><br>`;
                    reportHtml += `• نظام الحماية (روت/جيلبريك): ${rootOrJailbreak ? "<span class='fail'>مكتشف 🚨</span>" : "<span class='pass'>سليم ✅</span>"}<br>`;
                    reportHtml += `• وضع المطور: ${devMode ? "<span class='warning'>مفعل ⚠️</span>" : "<span class='pass'>مغلق ✅</span>"}<br>`;
                    reportHtml += `• فحص التلاعب بالموقع: ${fakeGps ? "<span class='fail'>يوجد تلاعب (Mock GPS) 🚨</span>" : "<span class='pass'>سليم وبدون تلاعب ✅</span>"}<br>`;
                    reportHtml += `<hr style="border-color:#334155; margin:10px 0;">`;
                    reportHtml += `📍 <b>الموقع الجغرافي المحدد:</b><br><span style="color: #38bdf8; font-size: 11px; line-height: 1.4; display: inline-block; margin-top: 4px;">${locationName}</span>`;

                    finalBox.innerHTML = reportHtml;
                    finalBox.style.display = "block";
                    btn.style.display = "none";
                },
                (error) => {
                    stepsBox.innerHTML += "<br><span class='fail'>[-] فشل رصد الموقع: يرجى السماح بالإذن لتتم عملية الفحص بنجاح.</span>";
                    btn.disabled = false;
                    btn.innerText = "إعادة الفحص";
                },
                { timeout: 12000, enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
