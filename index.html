<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحوصات الأمان وتغيير المواقع</title>
    <!-- استدعاء مكتبة تليجرام الرسمية للويب أب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0088cc;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #219653;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h2>🛡️️ نظام فحص الأمان</h2>
        <p id="welcome-msg">أهلاً بك. اضغط على الزر أدناه لبدء عملية التحقق والفحص الأمني الحالي لجهازك.</p>
        
        <button class="btn" id="start-btn" onclick="requestLocation()">بدء الفحص 🔍</button>
        
        <div id="result"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            const telegram = window.Telegram && window.Telegram.WebApp;
            
            // 🔒 حماية أمنية: التأكد أن الصفحة مفتوحة من داخل تليجرام فقط وليست من سفاري أو المتصفح الخارجي
            if (!telegram || !telegram.initData || telegram.initData === "") {
                document.body.innerHTML = `
                    <div style="text-align: center; margin-top: 80px; font-family: Tahoma; color: #c0392b; padding: 20px;">
                        <h2>❌ غير مسموح بالدخول</h2>
                        <p>عذراً، لا يمكنك فتح هذه الصفحة إلا من خلال بوت تليجرام الرسمي حصرياً.</p>
                    </div>
                `;
            } else {
                // تهيئة تليجرام وتوسيع النافذة لملء الشاشة
                telegram.ready();
                telegram.expand();
                
                // جلب معرف المستخدم من تليجرام إن وجد
                const userId = telegram.initDataUnsafe && telegram.initDataUnsafe.user ? telegram.initDataUnsafe.user.id : "غير معروف";
                console.log("User ID connected:", userId);
            }
        });

        // دالة طلب الموقع بطريقة احترافية عند الضغط على الزر فقط
        function requestLocation() {
            const resultDiv = document.getElementById("result");
            const btn = document.getElementById("start-btn");

            if (navigator.geolocation) {
                resultDiv.style.color = "#e67e22";
                resultDiv.innerText = "جاري التحقق من إحداثيات الموقع الحالي...";
                btn.disabled = true;

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resultDiv.style.color = "#27ae60";
                        resultDiv.innerHTML = `✅ تم الفحص بنجاح!<br>خط العرض: ${lat.toFixed(4)}<br>خط الطول: ${lon.toFixed(4)}`;
                        btn.style.display = "none";
                    },
                    (error) => {
                        resultDiv.style.color = "#c0392b";
                        resultDiv.innerText = "❌ تعذر تحديد الموقع. يرجى السماح للخدمة بالوصول للموقع لإتمام الفحص.";
                        btn.disabled = false;
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                resultDiv.style.color = "#c0392b";
                resultDiv.innerText = "متصفحك لا يدعم خاصية تحديد الموقع.";
            }
        }
    </script>
</body>
</html>
